environment: development

logging:
  level: INFO
  file: logs/jarvis.log

voice:
  wake_word: Jarvis
  backend: faster_whisper
  sample_rate: 16000
  whisper_model: base
  compute_type: int8
  vad_enabled: true
  speech_synthesizer: pyttsx3
  input_timeout_seconds: 6.0
  phrase_time_limit_seconds: 12.0
  tts_voice_hint: zira
  tts_rate: 175

llm:
  provider: openai_compatible
  model: qwen3
  timeout_seconds: 60.0
  api_base_url: http://localhost:11434/v1

vision:
  provider: ollama
  model: llava
  api_base_url: http://localhost:11434/v1
  timeout_seconds: 60.0
  max_image_size: 1080
  use_ocr: true
  ocr_engine: easyocr
  preprocess: true
  sharpen: true
  contrast: true
  cache_ttl_seconds: 3.0

memory:
  provider: in_memory
  max_messages: 20
  memory_enabled: true
  max_session_memories: 50
  max_long_term_memories: 1000
  auto_save: true
  retrieval_limit: 5

desktop:
  enabled: true
  search_timeout: 10.0
  max_results: 5
  allow_recursive_search: true
  preferred_browser: chrome

personality:
  traits:
    - Friendly
    - Professional
    - Calm
    - Helpful
    - Natural conversation
  style: concise, natural conversation

skills:
  auto_discover_entry_points: true
  plugin_paths: []
